<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/read_usuarios.css">

</head>
<body>
    <header>
          <section id="header_app">
            <img src="../imagenes/logo_app.webp" alt="" srcset="" id="logo_app">
            <Span id="header_app_name" class="efectos_titulo">Te Presto Online WEB</Span>
            <Span id="header_app_legend">Modulo de usuarios</Span>
          </section>
    </header>

    <main>
      <section id="formulario" class="">
         <form action="">
            <div class="mb-3 box_shadow_cajax">
            <fieldset id="form1">
              <legend>Datos Personales</legend>

              <label for="user_personal_name" class="form-label">Nombres</label>
              <input type="text" class="form-control txt1" id="user_personal_name" >
              
              <label for="user_personal_lastname" class="form-label">Apellidos</label>
              <input type="text" class="form-control txt1" id="user_personal_lastname" >


              <div class="input-group mb-3">
                  <select name="tipo_identificacion" id="tipo_identificacion" class="form-control txt1">
                    <option value="CED">CED</option>
                    <option value="PSS">PSS</option>
                  </select>&nbsp;
                  <input type="text" class="form-control txt1" id="user_personal_identificacion" placeholder="001-1111111-1" >
              </div>

            </fieldset>

            <div class="flex">
              <fieldset>
                <legend>Datos Direccion</legend>
                <input type="text" class="form-control txt1" id="user_personal_direccion_municipio" placeholder="Municipio" >
                <input type="text" class="form-control txt1" id="user_personal_direccion_sector" placeholder="Sector" >
                <input type="text" class="form-control txt1" id="user_personal_direccion_calle" placeholder="Calle" >
                <input type="text" class="form-control txt1" id="user_personal_direccion_vivienda" placeholder="Vivienda" >
              </fieldset>
  
              <fieldset>
                <legend>Datos Contactos</legend>
                <input type="email" class="form-control txt1" id="user_personal_contacto_email" placeholder="xxx@xx.com" >
                <input type="tel" class="form-control txt1" id="user_personal_contacto_tel" placeholder="809-000-0000" >
              </fieldset>
            </div>
          
             
            <label for="user_user_name" class="form-label">Usuario</label>
            <input type="text" class="form-control txt1" id="user_user_name" >
            <div class="mb-3">
              <label for="user_personal_lastname" class="form-label">ESTADO</label>              
              <select name="estado" id="estado" class="form-control txt1">
                <option value="1">ACTIVO</option>
                <option value="0">INACTIVO</option>
              </select>
            </div>
            

            </div>
         </form>
         <button class="btn btn-primary form-control" id="bt_guardar">Guardar</button>
      </section>

      <section id="lista_usuarios">
         <Span class="" id="header_app_listado">Listado de Usuarios</Span> 
        <table class="table table-hover">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">USER</th>
              <th scope="col">NOMBRE</th>
              <th scope="col">DIRECCION</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody id="cuerpo_tabla">

          </tbody>
        </table>
      </section>
    
    </main>

    <footer></footer>

    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
      import { getDatabase, ref, child, get,  onValue, set, update, push} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-analytics.js";

      var lista_usuarios = new Array(); // variable lista de usuarios
      var user_name_txt =  document.getElementById('user_personal_name');
      var user_LastName_txt =  document.getElementById('user_personal_lastname');
      var user_identificacion_txt =  document.getElementById('user_personal_identificacion');
      var tipo_identificacion =  document.getElementById('tipo_identificacion')
      var user_personal_direccion_municipio  =  document.getElementById('user_personal_direccion_municipio'); 
      var user_personal_direccion_sector     =  document.getElementById('user_personal_direccion_sector');
      var user_personal_direccion_calle      =  document.getElementById('user_personal_direccion_calle');
      var user_personal_direccion_vivienda   =  document.getElementById('user_personal_direccion_vivienda');
      var user_personal_contacto_email  =  document.getElementById('user_personal_contacto_email'); 
      var user_personal_contacto_tel    =  document.getElementById('user_personal_contacto_tel');        
      var user_user_name   =  document.getElementById('user_user_name');        
      var estado   =  document.getElementById('estado');        
      var bt_guardar    =  document.getElementById('bt_guardar');  
       

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getDatabase();

      var user_select;

      leer_database();

    //  console.log(lista_usuarios);

      function leer_database() {  
         const dbref = ref(db);
         const dbref_user = ref(db,'usuarios');
         var tabla = document.getElementById('cuerpo_tabla');

         onValue(dbref_user, (snapshot) => {
         const data = snapshot.val();
         tabla.innerHTML="";
         // Bucle para recorrer los usuarios
         for (const key in data) {
           if (data.hasOwnProperty(key)) {
             const usuario = data[key];
             lista_usuarios.push(usuario);
               var nuevaFila = tabla.insertRow(-1);

               var id = document. createElement('td');
               var user = document.createElement('td');
               var user_name = document.createElement('td');
               var user_address = document.createElement('td');
               var bt_ver = document.createElement('button');
               var bt_sub_users = document.createElement('button');
               
               bt_ver.classList.add("form-control");
               bt_sub_users.classList.add("form-control");
               
               bt_ver.addEventListener("click", function() {
                ver_usuario(usuario);
               });

               bt_sub_users.addEventListener("click", function() {
                leer_database_sub_usuarios(usuario.id);
               });

               id.innerHTML = usuario.id;
               user.innerHTML = usuario.usuario;
               user_address.innerHTML = get_user_direccion(usuario);
               user_name.innerHTML =  get_user_name(usuario);
               bt_ver.innerHTML = 'seleccionar';
               bt_sub_users.innerHTML = 'sub_usuarios';

               nuevaFila.appendChild(id);
               nuevaFila.appendChild(user);
               nuevaFila.appendChild(user_name);
               nuevaFila.appendChild(user_address);
               nuevaFila.appendChild(bt_ver);
               nuevaFila.appendChild(bt_sub_users);

           }
         }
         });
      }

      function get_user_name(usuario){
        var name='NO NAME';
        try {
          name=  usuario.datos_personales.nombres +' ' +usuario.datos_personales.apellidos;
        } catch (error) {
            name='NO NAME';
        }

        return name;
      }

      function get_user_direccion(usuario){
        var name;
        try {
          name=  usuario.datos_personales.direccion.municipio +' , '+
                 usuario.datos_personales.direccion.sector +' , '+
                 usuario.datos_personales.direccion.calle +' , '+
                 usuario.datos_personales.direccion.vivienda; 

        } catch (error) {
          name='NO ADDRESS';
        }

        return name;
      }

      function ver_usuario(user) {
          set_txt_null();//limpio los campos
          user_seleccionado = user;
          try{
            user_name_txt.value = ''+user.datos_personales.nombres;
            user_LastName_txt.value = ''+user.datos_personales.apellidos;
            user_identificacion_txt.value = ''+user.datos_personales.identificacion;

            user_personal_direccion_municipio.value = ''+user.datos_personales.direccion.municipio;    
            user_personal_direccion_sector.value = ''+user.datos_personales.direccion.sector;    
            user_personal_direccion_calle.value = ''+user.datos_personales.direccion.calle;     
            user_personal_direccion_vivienda.value = ''+user.datos_personales.direccion.vivienda;  

            user_personal_contacto_email.value = ''+user.datos_personales.contacto.correo;  
            user_personal_contacto_tel.value = ''+user.datos_personales.contacto.telefono;  
            user_user_name.value = ''+user.usuario;

            switch (user.datos_personales.tipo_identificacion) {
              case 'CED':
                tipo_identificacion.value ='CED';
                break;
              default:
                tipo_identificacion.value='PSS';
                break;
            }

            switch (user.estado) {
              case 1:
                estado.value ='1';
                break;
              case 0:
                estado.value='0';
                break;
            }

        }catch(e){
            alert('error al seleccionar usuario incompleto')
        }
      }

      function set_txt_null() {
             user_name_txt.value = '';
             user_LastName_txt.value = '';
             user_identificacion_txt.value = '';
             user_personal_direccion_municipio.value = '';    
             user_personal_direccion_sector.value = '';    
             user_personal_direccion_calle.value = '';     
             user_personal_direccion_vivienda.value = '';  
             user_personal_contacto_email.value = '';  
             user_personal_contacto_tel.value = '';
             tipo_identificacion.value ='1';   
             user_user_name.value =''; 
             user_seleccionado = null; 
             estado.value = '1';
      }   
      
      function alertar_guardado() {
        alert('Datos Guardados Correctamente');
        set_txt_null();
      }

      function guardar() {  
        if(user_seleccionado!=null){
          setear_datos();
             
          set(ref(db, 'usuarios/'+user_seleccionado.id), {
            clave:                  user_seleccionado.clave,
            contador_clave:         user_seleccionado.contador_clave,
            datos_personales:       user_seleccionado.datos_personales,
            estado:                 user_seleccionado.estado,
            fecha_activacion_unix:  user_seleccionado.fecha_activacion_unix,
            fecha_alta_humana:      user_seleccionado.fecha_alta_humana,
            fecha_humana_ult_mod:   user_seleccionado.fecha_humana_ult_mod,
            fecha_unix:             user_seleccionado.fecha_unix,
            fecha_unix_ult_mod:     user_seleccionado.fecha_unix_ult_mod,
            id:                     user_seleccionado.id,
            usuario:                user_seleccionado.usuario
          })
          .then(() => alertar_guardado())
          .catch((error) => alert('Error Al intentar Ingresar/Modificar Datos . : '+error) );
        }else{
          alert('Se debe Seleccionar Un Usuario Primero!!');
        }
      }

      function setear_datos() {
           //seteo los datos personales de la direccion
           user_seleccionado.datos_personales.direccion.municipio = user_personal_direccion_municipio.value;
           user_seleccionado.datos_personales.direccion.sector    = user_personal_direccion_sector.value;
           user_seleccionado.datos_personales.direccion.calle     = user_personal_direccion_calle.value;
           user_seleccionado.datos_personales.direccion.vivienda  = user_personal_direccion_vivienda.value;
           //seteo los datos personales del contacto
           user_seleccionado.datos_personales.contacto.correo     = user_personal_contacto_email.value;
           user_seleccionado.datos_personales.contacto.telefono   = user_personal_contacto_tel.value;
           //seteo los datos personales
           user_seleccionado.datos_personales.nombres              = user_name_txt.value;
           user_seleccionado.datos_personales.apellidos            = user_LastName_txt.value;
           user_seleccionado.datos_personales.identificacion       = user_identificacion_txt.value;
           user_seleccionado.datos_personales.tipo_identificacion  = tipo_identificacion.value;
           //saeteo el nombre de usuario
           user_seleccionado.usuario = user_user_name.value;
           user_seleccionado.estado = estado.value;
      }

      function leer_database_sub_usuarios(id) {  
         display_blok_sub_ser();
         const dbref = ref(db);
         const dbref_user = ref(db,'sub_usuarios');
         var tabla = document.getElementById('cuerpo_tabla_sub_users');

         onValue(dbref_user, (snapshot) => {
         const data = snapshot.val();
         tabla.innerHTML="";
         // Bucle para recorrer los usuarios
         for (const key in data) {
           if (data.hasOwnProperty(key)) {
             const usuario = data[key];
             console.log(usuario);
            if(usuario.id_super_usaurio == id){//valido que solo muestre los sub usuarios del cliente principal
               var nuevaFila = tabla.insertRow(-1);

               var id = document. createElement('td');
               var user = document.createElement('td');
               var bt_ver = document.createElement('button');
               
               bt_ver.classList.add("form-control");
               
               bt_ver.addEventListener("click", function() {
                //ver_usuario(usuario);
               });

               id.innerHTML = usuario.id;
               user.innerHTML = usuario.usuario;
               bt_ver.innerHTML = 'seleccionar';

               nuevaFila.appendChild(id);
               nuevaFila.appendChild(user);
               nuevaFila.appendChild(bt_ver);

           }
          }
         }
         });
         
      }

      bt_guardar.addEventListener('click',guardar);
      
    </script>

    <div id="modal_sub_usuarios" class="center display_none">
      <div class="clas_flex">
        <section id="formulario" class="">
        <form action="">
           <div class="mb-3 box_shadow_cajax">
           <fieldset id="form1">
             <legend>Datos Personales</legend>

             <label for="user_personal_name" class="form-label">Nombres</label>
             <input type="text" class="form-control txt1" id="user_personal_name" >
             
             <label for="user_personal_lastname" class="form-label">Apellidos</label>
             <input type="text" class="form-control txt1" id="user_personal_lastname" >


             <div class="input-group mb-3">
                 <select name="tipo_identificacion" id="tipo_identificacion" class="form-control txt1">
                   <option value="CED">CED</option>
                   <option value="PSS">PSS</option>
                 </select>&nbsp;
                 <input type="text" class="form-control txt1" id="user_personal_identificacion" placeholder="001-1111111-1" >
             </div>

           </fieldset>

           <div class="flex">
             <fieldset>
               <legend>Datos Direccion</legend>
               <input type="text" class="form-control txt1" id="user_personal_direccion_municipio" placeholder="Municipio" >
               <input type="text" class="form-control txt1" id="user_personal_direccion_sector" placeholder="Sector" >
               <input type="text" class="form-control txt1" id="user_personal_direccion_calle" placeholder="Calle" >
               <input type="text" class="form-control txt1" id="user_personal_direccion_vivienda" placeholder="Vivienda" >
             </fieldset>
 
             <fieldset>
               <legend>Datos Contactos</legend>
               <input type="email" class="form-control txt1" id="user_personal_contacto_email" placeholder="xxx@xx.com" >
               <input type="tel" class="form-control txt1" id="user_personal_contacto_tel" placeholder="809-000-0000" >
             </fieldset>
           </div>
         
            
           <label for="user_user_name" class="form-label">Usuario</label>
           <input type="text" class="form-control txt1" id="user_user_name" >
           <div class="mb-3">
             <label for="user_personal_lastname" class="form-label">ESTADO</label>              
             <select name="estado" id="estado" class="form-control txt1">
               <option value="1">ACTIVO</option>
               <option value="0">INACTIVO</option>
             </select>
           </div>
           

           </div>
        </form>
        <button class="btn btn-primary form-control" id="bt_guardar">Guardar</button>
      </section>

      <section id="lista_sub_usuarios">
        <Span class="" id="header_app_listado">Listado De Sub Usuarios</Span> 
        <table class="table table-hover">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">USER</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody id="cuerpo_tabla_sub_users">

          </tbody>
        </table>
      </section>
      </div>
    </div>
</body>
